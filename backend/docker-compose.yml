services:
  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  worker:
    build: .                  # <-- this tells Compose to build from the Dockerfile in the current folder
    image: manhwa-worker      # optional tag
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped
    command: celery -A core.celery_app worker --loglevel=info --pool=solo